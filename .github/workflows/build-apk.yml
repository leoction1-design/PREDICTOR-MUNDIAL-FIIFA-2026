name: Build Android APK

# Se ejecuta automáticamente al hacer push a main/master,
# o manualmente desde la pestaña "Actions" de GitHub (workflow_dispatch).
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app web (Vite)
        run: npm run build

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: predictor-mundial-fifa-2026-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
