name: Build Android APK

# SOLO MANUAL, a proposito.
#
# Este flujo no ha terminado bien ni una sola vez en 10 ejecuciones: siempre muere en
# `npx cap sync android`. Mientras tanto el ciclo diario empuja datos a docs/ cada
# manana, asi que cada dia disparaba una compilacion condenada a fallar y un correo
# de aviso. La APK ademas no es el producto: lo que se usa es la web de docs/.
#
# Se ejecuta desde la pestana Actions -> Build Android APK -> Run workflow.
# Para volver a compilar en cada push, devolver aqui:
#     push:
#       branches: [ main, master ]
#       paths-ignore: [ 'docs/**', 'web/**', '*.md' ]
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar la app web (Vite)
        run: npm run build

      # `cap doctor` imprime versiones y estado de la plataforma. Va antes del sync y
      # con `|| true` para que su salida quede en el registro aunque el sync reviente:
      # el fallo actual solo reporta "exit code 1" y asi no se puede diagnosticar.
      - name: Diagnostico de Capacitor
        run: npx cap doctor || true

      - name: Sincronizar Capacitor con Android
        run: npx cap sync android --verbose

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Subir APK como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: predictor-mundial-fifa-2026-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
