name: Build Android APK

# Solo manual, y por una razon de fondo: la APK ya no necesita recompilarse cuando
# cambian los datos. Envuelve la web de docs/, y esa pagina pide datos frescos a
# docs/datos.json al abrirse, asi que una APK compilada una vez sigue mostrando los
# pronosticos de hoy. Recompilar solo hace falta si cambia el diseno o el motor.
#
# Actions -> Build Android APK -> Run workflow.
on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Sin lockfile compartido con la web: aqui solo viven las tres piezas de
      # Capacitor. No hay paso de compilacion porque docs/ ya es el sitio terminado.
      - name: Instalar Capacitor
        run: npm install --no-audit --no-fund

      - name: Diagnostico
        run: npx cap doctor || true

      - name: Copiar la web a la plataforma Android
        run: npx cap sync android --verbose

      - name: Permisos de gradlew
        run: chmod +x android/gradlew

      - name: Compilar APK debug
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir la APK
        uses: actions/upload-artifact@v4
        with:
          name: golcast-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
